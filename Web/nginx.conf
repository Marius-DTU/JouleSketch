server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # nginx already sends .wasm as application/wasm, which browsers require.
    gzip on;
    gzip_types application/wasm application/javascript text/css;

    # The page itself is always fetched fresh, so users get new versions
    # right away; the other files have versioned names and can be cached.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
