# Builds the web (Windows) version as a container on every push to main and
# publishes it to GitHub's container registry (ghcr.io). The server picks up
# the new image by itself (see deploy/docker-compose.yml).
name: Web-version

on:
  push:
    branches: [main]
    paths:
      - "JouleSketch/**"
      - "Web/**"
      - "Package.swift"
      - "Package.resolved"
      - "Dockerfile"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names must be lowercase; this also tags it "latest".
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Reuses unchanged steps (e.g. the Swift tools) from earlier builds.
          cache-from: type=gha
          cache-to: type=gha,mode=max
