# Runs on the server (e.g. as a Dockge stack). Fetches the finished web
# version from GitHub and updates it by itself when a new version has been
# pushed.
#
# The image is private, so a GitHub token with read:packages is needed. Put it
# in the stack's .env (in Dockge: the ".env" field under the compose text):
#   GHCR_USER=Marius-DTU
#   GHCR_TOKEN=ghp_...
# Watchtower logs in with these by itself. The very first fetch of the
# joulesketch image is done by Docker, which needs one "docker login ghcr.io"
# where the stack is started (see Web/README.md).
services:
  joulesketch:
    image: ghcr.io/marius-dtu/joulesketch:latest
    ports:
      - "8080:80"
    restart: unless-stopped
    labels:
      - com.centurylinklabs.watchtower.enable=true

  # Looks for a new image every 5 minutes and restarts with it.
  watchtower:
    image: nickfedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - REPO_USER=${GHCR_USER}
      - REPO_PASS=${GHCR_TOKEN}
    command: --label-enable --cleanup --interval 300
